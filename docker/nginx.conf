server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    include /etc/nginx/snippets/iq-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # Resolve the isolated PHP-FPM alias through Docker DNS at request
        # time, so replacing the app container cannot leave a stale IP.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $php_fpm_upstream iqprofil-php-fpm:9000;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|avif|webp|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/iq-security-headers.conf;
        try_files $uri =404;
    }
}
