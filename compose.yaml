services:
  app:
    build:
      context: .
      target: app
    # Keep PHP-FPM off the shared Dokploy proxy network. The dedicated
    # backend alias prevents collisions with other projects named "app".
    networks:
      backend:
        aliases:
          - iqprofil-php-fpm
    environment:
      APP_NAME: "IQ.Профиль"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set the Laravel APP_KEY in Dockploy or .env}"
      APP_URL: "${APP_URL:?Set the public HTTPS APP_URL in Dockploy}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      SESSION_LIFETIME: "10080"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      LOG_CHANNEL: stderr
      # External delivery is opt-in; without SMTP credentials reset links stay in logs.
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@flatero.ru}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-IQ.Профиль}"
    volumes:
      - iq_database:/var/www/html/database
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    # Traefik reaches web on dokploy-network; web reaches PHP on backend.
    networks:
      - backend
      - dokploy-network
    expose:
      - "80"
    # Dokploy's native Domain handles flatero.ru. These extra Traefik
    # routers redirect www.flatero.ru without serving duplicate content.
    # The www DNS record already resolves to this Dokploy server.
    # Router names do not conflict with Dokploy's generated labels.
    labels:
      traefik.enable: "true"
      traefik.docker.network: "dokploy-network"
      traefik.http.routers.iqprofil-www-http.rule: "Host(`www.flatero.ru`)"
      traefik.http.routers.iqprofil-www-http.entrypoints: "web"
      traefik.http.routers.iqprofil-www-http.middlewares: "iqprofil-www-redirect"
      traefik.http.routers.iqprofil-www-http.service: "iqprofil-www-backend"
      traefik.http.routers.iqprofil-www-https.rule: "Host(`www.flatero.ru`)"
      traefik.http.routers.iqprofil-www-https.entrypoints: "websecure"
      traefik.http.routers.iqprofil-www-https.tls: "true"
      traefik.http.routers.iqprofil-www-https.tls.certresolver: "letsencrypt"
      traefik.http.routers.iqprofil-www-https.middlewares: "iqprofil-www-redirect"
      traefik.http.routers.iqprofil-www-https.service: "iqprofil-www-backend"
      traefik.http.middlewares.iqprofil-www-redirect.redirectregex.regex: "^https?://www\\.flatero\\.ru(.*)"
      # $$ is escaped by Compose to one $ so Traefik preserves the path and query.
      traefik.http.middlewares.iqprofil-www-redirect.redirectregex.replacement: "https://flatero.ru$${1}"
      traefik.http.middlewares.iqprofil-www-redirect.redirectregex.permanent: "true"
      traefik.http.services.iqprofil-www-backend.loadbalancer.server.port: "80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  iq_database:

networks:
  backend:
  dokploy-network:
    external: true
