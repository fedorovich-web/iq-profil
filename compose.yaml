services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_NAME: "IQ.Профиль"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set the Laravel APP_KEY in Dockploy or .env}"
      APP_URL: "${APP_URL:?Set the public HTTPS APP_URL in Dockploy}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      SESSION_LIFETIME: "10080"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CACHE_STORE: database
      LOG_CHANNEL: stderr
    volumes:
      - iq_database:/var/www/html/database
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    expose:
      - "80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  iq_database:
