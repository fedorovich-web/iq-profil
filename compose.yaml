services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_NAME: "IQ.Профиль"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set the Laravel APP_KEY in Dockploy or .env}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      SESSION_LIFETIME: "1440"
      CACHE_STORE: database
      LOG_CHANNEL: stderr
    volumes:
      - iq_database:/var/www/html/database
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  iq_database:
