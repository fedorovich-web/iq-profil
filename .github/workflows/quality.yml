name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, dom, intl, pdo_sqlite, sqlite3, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated environment
        run: |
          cp .env.example .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8123#' .env
          php artisan key:generate --force --no-interaction
          touch database/database.sqlite
          mkdir -p .incoming

      - name: PHP dependency audit
        run: composer audit --locked

      - name: Frontend dependencies and checks
        run: |
          npm ci
          npm audit --audit-level=moderate
          node --check resources/js/app.js
          node --check scripts/browser-e2e.mjs
          npm run build

      - name: Validate production Compose configuration
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://flatero.ru
        run: docker compose config --quiet

      - name: PHP style and tests
        run: |
          vendor/bin/pint --test
          php artisan test --compact

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Prepare browser-test database
        run: php artisan migrate --seed --force --no-interaction

      - name: Start local server
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8123 > .incoming/server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8123/up >/dev/null; then exit 0; fi
            sleep 1
          done
          cat .incoming/server.log
          exit 1

      - name: Browser E2E
        env:
          IQ_TEST_BASE_URL: http://127.0.0.1:8123
          IQ_TEST_SCREENSHOT_DIR: .incoming/browser-screenshots
          IQ_TEST_REPORT_FILE: .incoming/browser-report.json
        run: node scripts/browser-e2e.mjs

      - name: SVG geometry, uniqueness, and five viewport visual QA
        env:
          IQ_TEST_SVG_SCREENSHOT_DIR: .incoming/svg-qa
        run: node scripts/svg-visual-qa.mjs

      - name: FAQ animation, keyboard, and layout stability
        env:
          IQ_TEST_BASE_URL: http://127.0.0.1:8123
        run: node scripts/faq-stability-qa.mjs

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-failure-diagnostics
          path: |
            .incoming/server.log
            .incoming/browser-report.json
            .incoming/browser-screenshots/
            .incoming/svg-qa/
          retention-days: 7
